name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Weekly: new RustSec advisories and breakage from upcoming toolchains.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    # A hung test fails here, not at the 6-hour job limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # Early warning for the next release; failures don't block merges.
          - os: ubuntu-latest
            toolchain: beta
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        env:
          RUSTFLAGS: -D warnings
      - run: cargo bench --workspace --no-run --locked
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

  # Against real Centrifugo (docker-compose.yml, docs/spec.md §11.4).
  real-server:
    name: real server (Centrifugo)
    runs-on: ubuntu-latest
    # A hung test fails here, not at the 6-hour job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Centrifugo PRO (channel compaction) runs locally only: see CONTRIBUTING.md.
      - run: docker compose up -d --wait
      - run: cargo test -p centrifuge-client --test real_server --locked
        env:
          CENTRIFUGO_TESTS: "1"
          # Captured per test: printed only for a failed one.
          RUST_LOG: centrifuge=debug
      # A job cancelled by its time limit is cancelled, not failed.
      - if: failure() || cancelled()
        run: docker compose logs --tail 200

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --lib --all-features --locked

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    # A hung test fails here, not at the 6-hour job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Without a TLS crypto provider the client is a compile_error! (spec
      # §3.3); depth 3 covers the codec × transport × provider combinations.
      # No --locked: --no-dev-deps edits the manifests, so the lock file differs.
      - run: cargo hack check --workspace --feature-powerset --depth 3 --at-least-one-of aws-lc-rs,ring --exclude-features test-util --no-dev-deps
        env:
          RUSTFLAGS: -D warnings

  minimal-versions:
    name: minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack,cargo-minimal-versions
      # The lower bounds in Cargo.toml must really build: users may resolve them.
      - run: cargo minimal-versions check --workspace --direct --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nightly, as docs.rs builds with it (`--cfg docsrs`).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # A hung test fails here, not at the 6-hour job limit.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # Fork PRs get no OIDC token; coverage is informational there.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  wasm-core:
    name: builds for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The sans-IO core must stay free of IO and runtime dependencies, so a
      # browser build stays possible (docs/spec.md §9.11).
      - run: cargo check -p centrifuge-client-core --target wasm32-unknown-unknown --locked
        env:
          RUSTFLAGS: -D warnings
      # The client in a browser (docs/wasm-plan.md): with and without
      # HTTP-streaming, and the browser test target.
      - run: cargo clippy -p centrifuge-client --target wasm32-unknown-unknown --lib --test browser --locked -- -D warnings
      - run: cargo clippy -p centrifuge-client --target wasm32-unknown-unknown --lib --no-default-features --features json --locked -- -D warnings
      # No native-only crate reaches the browser build, and no blocking Tokio
      # API is used on its path.
      - name: Native-only crates stay out of the wasm graph
        run: |
          tree=$(cargo tree -p centrifuge-client --target wasm32-unknown-unknown -e normal --prefix none --locked)
          if echo "$tree" | grep -E '^(mio|hyper|hyper-util|rustls|tokio-rustls|tokio-tungstenite|rustls-platform-verifier|getrandom) '; then
            exit 1
          fi
      - name: No blocking Tokio APIs
        run: |
          if grep -rnE 'spawn_blocking|block_in_place|blocking_(lock|recv|send)' crates/centrifuge-client/src; then
            exit 1
          fi

  browser:
    name: browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A hung test fails here, not at the 6-hour job limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: browser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The test runner must match the wasm-bindgen version in Cargo.lock.
      - name: wasm-bindgen version
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - run: docker compose up -d --wait
      # The runner image ships each browser with its matching driver.
      - name: Driver
        run: |
          if [ "$BROWSER" = chrome ]; then
            echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          else
            echo "GECKODRIVER=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"
          fi
        env:
          BROWSER: ${{ matrix.browser }}
      # browser.rs runs in the page, worker.rs in a Dedicated Worker.
      - run: cargo test -p centrifuge-client --target wasm32-unknown-unknown --test browser --test worker --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          # The ping test stays connected for 40 s.
          WASM_BINDGEN_TEST_TIMEOUT: "90"
      # Back/forward cache, worker.terminate() and a hanging POST, driven from outside
      # (tests/browser-e2e): Chrome only, the runner's own.
      - name: Browser e2e
        if: matrix.browser == 'chrome'
        working-directory: tests/browser-e2e
        run: |
          cargo build --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --out-dir www/pkg target/wasm32-unknown-unknown/debug/browser_e2e.wasm
          npm ci --no-fund --no-audit
          node run.mjs
      # A warning, never a failure: the gzipped size of a minimal app (the e2e
      # one, release, name section removed) against tests/browser-e2e/size-baseline,
      # updated on purpose when a change is worth its size.
      - name: Browser build size
        if: matrix.browser == 'chrome'
        working-directory: tests/browser-e2e
        run: |
          cargo build --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir target/size target/wasm32-unknown-unknown/release/browser_e2e.wasm
          size=$(gzip -9 -c target/size/browser_e2e_bg.wasm | wc -c)
          base=$(cat size-baseline)
          echo "Browser build: $size bytes gzipped (baseline $base)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((base * 11 / 10)) ]; then
            echo "::warning::browser build is $size bytes gzipped, over 10% above the $base baseline"
          fi
      - if: failure() || cancelled()
        run: docker compose logs --tail 200

  # Build only: the platform verifier's API differs on mobile (docs/spec.md §5.2).
  # cargo-ndk points aws-lc-rs's C build at the runner's NDK (ANDROID_NDK_HOME).
  # Three feature sets: with --all-features aws-lc-rs wins over ring, so ring
  # needs its own run, and the default set is what most apps build.
  android:
    name: builds for Android (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            features: --all-features
            # Every ABI an app usually ships: phones, older 32-bit phones,
            # emulators.
            abis: -t arm64-v8a -t armeabi-v7a -t x86_64
          - name: default features
            features: ""
            abis: -t arm64-v8a
          - name: ring
            features: --no-default-features --features ring,json,http-stream,system-proxy,delta,serde
            abis: -t arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Word splitting of ABIS and FEATURES is intended.
      - run: cargo ndk $ABIS check -p centrifuge-client $FEATURES --locked
        env:
          ABIS: ${{ matrix.abis }}
          FEATURES: ${{ matrix.features }}
          RUSTFLAGS: -D warnings

  ios:
    name: builds for iOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            features: --all-features
          - name: default features
            features: ""
          - name: ring
            features: --no-default-features --features ring,json,http-stream,system-proxy,delta,serde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Word splitting of FEATURES is intended.
      - run: cargo check -p centrifuge-client --target aarch64-apple-ios $FEATURES --locked
        env:
          FEATURES: ${{ matrix.features }}
          RUSTFLAGS: -D warnings

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory against an existing dependency shouldn't block unrelated
    # PRs; it still fails on main and in the weekly run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  zizmor:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Report in the log instead of uploading SARIF (needs no extra permissions).
          advanced-security: false

  # One required check for branch protection, independent of the job list above.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, real-server, msrv, features, minimal-versions, docs, wasm-core, browser, android, ios, deny, typos, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

[workspace]
resolver = "3"
members = ["crates/centrifuge-client-core", "crates/centrifuge-client", "crates/centrifuge-fake-server", "examples/browser", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
# MSRV: the floor set by tokio, hyper-util, tokio-tungstenite and
# rustls-platform-verifier (docs/spec.md §3.1). CI reads it from here.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/centrifugal/centrifuge-rust"
homepage = "https://centrifugal.dev"

[workspace.dependencies]
centrifuge-client-core = { version = "=0.1.2", path = "crates/centrifuge-client-core", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

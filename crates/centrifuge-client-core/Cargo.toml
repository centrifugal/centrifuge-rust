[package]
name = "centrifuge-client-core"
description = "Sans-IO protocol state machine behind centrifuge-client. Not a stable API: use centrifuge-client."
documentation = "https://docs.rs/centrifuge-client-core"
readme = "README.md"
keywords = ["centrifugo", "centrifuge", "sans-io"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["/src", "/proto", "/Cargo.toml", "/README.md"]

# No IO, no runtime, no clock: builds for every target, wasm32-unknown-unknown
# included (checked in CI). Dependencies must keep it that way (docs/spec.md §9.11).
[dependencies]
bytes = "1.12"
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", features = ["raw_value"], optional = true }

# A clock type for wasm32 (`time::Instant`); not built elsewhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4"
proptest = "1"
serde_json = "1.0.140"

[[bench]]
name = "codec"
harness = false
required-features = ["json"]

[features]
default = ["json"]
# The JSON protocol codec. Protobuf is always available: its types are the
# core's wire model.
json = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true

[package]
name = "browser-demo"
description = "A chat page with centrifuge-client in the browser (WASM); run it with docker compose (README)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
centrifuge-client = { path = "../../crates/centrifuge-client", default-features = false }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[lints]
workspace = true
